<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Basics Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <p class="course">GIN446 · Chapter 6 - JavaScript Part 1 · Lab 05</p>
      <h1>JavaScript Basics Quiz</h1>
      <p class="subtitle">5 questions · choose one answer per question</p>
    </header>

    <!-- The questions are generated by quiz.js and written inside this div -->
    <section id="quiz"></section>

    <!-- onclick calls the function submitQuiz() written in quiz.js -->
    <button type="button" class="btn" onclick="submitQuiz()">Check my answers</button>

    <!-- The score and the correction are written inside this div -->
    <section id="result"></section>
  </main>

  <!-- The script is loaded at the end of the body, after the HTML it uses -->
  <script src="quiz.js"></script>
</body>
</html>
