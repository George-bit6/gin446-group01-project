<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A JavaScript quiz that loads questions from JSON with fetch.">
  <title>Live Quiz · GIN446 Lab 08</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="directory-link"><a href="../../index.html">← All labs</a></p>
    <p class="course">GIN446 · Chapter 8 - JavaScript Part 3 · Lab 08</p>
    <h1 id="quiz-title">Live Quiz</h1>
    <p id="best" class="best">Best score: – (no game yet)</p>

    <div id="loader" class="loader hidden" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span> Loading the questions…
    </div>

    <div id="error" class="error hidden" role="alert">
      <p id="error-msg"></p>
      <button type="button" id="retry" class="btn-secondary">Try again</button>
    </div>

    <p id="warning" class="warning hidden" role="status"></p>

    <section id="quiz" class="hidden" aria-live="polite">
      <p id="progress" class="progress"></p>
      <h2 id="question"></h2>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button type="button" id="next" class="btn-primary" disabled>Next</button>
    </section>

    <section id="result" class="result hidden" aria-live="polite">
      <h2>Quiz finished</h2>
      <p id="score" class="score"></p>
      <p id="verdict" class="verdict"></p>
      <button type="button" id="restart" class="btn-primary">Play again</button>
    </section>
  </main>

  <script src="quiz.js"></script>
</body>
</html>
